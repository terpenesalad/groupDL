<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>groupDL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='20' rx='5' fill='none' stroke='%23d62839' stroke-width='3.5'/%3E%3Cpath d='M13 11v10l8-5z' fill='%231b2430'/%3E%3C/svg%3E">
<style>
:root {
  --table: #e8ecf1;          /* the light table */
  --sheet: #ffffff;          /* paper */
  --ink: #1b2430;            /* navy ink */
  --ink-2: #4f5b6b;
  --ink-3: #7c8796;
  --rule: #cfd6df;
  --marker: #d62839;         /* china-marker red: what's ticked */
  --marker-soft: rgba(214, 40, 57, .10);
  --steel: #2f5d8a;          /* progress */
  --steel-soft: rgba(47, 93, 138, .14);
  --ok: #2e7d4f;
  --warn-bg: #fff4d6;
  --warn-ink: #6b4e00;
  --shadow: 0 1px 0 rgba(27, 36, 48, .06), 0 2px 8px rgba(27, 36, 48, .06);
  --font: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --table: #182029;
    --sheet: #222c38;
    --ink: #e7ecf2;
    --ink-2: #b3bdc9;
    --ink-3: #8592a2;
    --rule: #344152;
    --marker: #ff5a68;
    --marker-soft: rgba(255, 90, 104, .14);
    --steel: #7fb0e0;
    --steel-soft: rgba(127, 176, 224, .16);
    --ok: #6fcf97;
    --warn-bg: #3a3017;
    --warn-ink: #f1d792;
    --shadow: 0 1px 0 rgba(0, 0, 0, .25), 0 2px 10px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--table);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--steel); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--rule); background: var(--sheet);
  padding: 7px 12px; border-radius: 8px; cursor: pointer;
  font-weight: 550; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding: 6px 8px; }
.btn.quiet:hover { color: var(--ink); background: var(--steel-soft); }
.btn.primary {
  background: var(--ink); color: var(--sheet); border-color: var(--ink);
  padding: 10px 18px; font-size: 15px; font-weight: 650;
}
.btn.primary:hover { filter: brightness(1.15); }
.btn svg { width: 16px; height: 16px; flex: none; }

/* ---------- header ---------- */
header.top {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px; max-width: 1440px; margin: 0 auto;
}
.wordmark {
  font-weight: 800; font-stretch: 125%; font-size: 22px; letter-spacing: -.01em;
  display: flex; align-items: center; gap: 3px; margin: 0;
}
.wordmark .frame {
  display: inline-block; border: 3px solid var(--marker); border-radius: 7px;
  padding: 0 6px 1px; line-height: 1.1; transform: rotate(-2deg);
}
header .spacer { flex: 1; }
.dl-toggle .count {
  background: var(--steel); color: var(--sheet); border-radius: 99px;
  font-size: 12px; padding: 0 7px; min-width: 20px; text-align: center;
}

/* ---------- URL input ---------- */
.intake { max-width: 1440px; margin: 0 auto; padding: 4px 24px 18px; }
.intake form {
  display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: start;
}
.urlbox {
  width: 100%; resize: vertical; min-height: 50px; max-height: 240px;
  padding: 13px 15px; border-radius: 10px; border: 1.5px solid var(--rule);
  background: var(--sheet); font-size: 15px; line-height: 1.5; box-shadow: var(--shadow);
}
.urlbox:focus { outline: none; border-color: var(--steel); }
.intake .side { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); align-items: center; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
.chip span {
  display: inline-block; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--rule);
  background: var(--sheet); font-weight: 550;
}
.chip input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--sheet); }
.chip input:focus-visible + span { outline: 2.5px solid var(--steel); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--ink-3); grid-column: 1 / -1; margin: 0; }
.hint kbd { font-family: inherit; border: 1px solid var(--rule); border-radius: 4px; padding: 0 4px; font-size: 12px; }

.banner {
  max-width: 1392px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn-ink); font-size: 14px;
}
.banner[hidden] { display: none; }

/* ---------- toolbar ---------- */
.toolbar {
  position: sticky; top: 0; z-index: 5; background: var(--table);
  border-bottom: 1px solid var(--rule);
}
.toolbar .inner {
  max-width: 1440px; margin: 0 auto; padding: 10px 24px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.tally { font-size: 14px; color: var(--ink-2); margin-right: auto; }
.tally strong { color: var(--ink); font-weight: 700; }
.search {
  border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet);
  padding: 7px 11px; width: 220px; font-size: 14px;
}
.select {
  border: 1px solid var(--rule); border-radius: 8px; background: var(--sheet);
  padding: 7px 9px; font-size: 14px;
}

/* ---------- sheet ---------- */
main { max-width: 1440px; margin: 0 auto; padding: 8px 24px 140px; }
.section { margin: 22px 0 34px; }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-head h2 { font-size: 21px; font-weight: 750; font-stretch: 105%; margin: 0; letter-spacing: -.01em; }
.tag {
  font-size: 12.5px; font-weight: 650; color: var(--ink-2);
  border: 1px solid var(--rule); border-radius: 5px; padding: 0 7px;
}
.section-head .meta { font-size: 14px; color: var(--ink-3); }
.section-head .acts { margin-left: auto; display: flex; gap: 2px; }
.section-error {
  padding: 14px 16px; border-radius: 10px; border: 1.5px dashed var(--rule);
  color: var(--ink-2); background: var(--sheet); max-width: 820px;
}
.section-error p { margin: 4px 0 0; }

.grid {
  display: grid; gap: 18px 16px;
  grid-template-columns: repeat(auto-fill, minmax(218px, 1fr));
}
.card {
  position: relative; display: block; cursor: pointer; user-select: none;
  border-radius: 10px; padding: 6px 6px 10px; background: var(--sheet); box-shadow: var(--shadow);
  outline: 3px solid transparent; outline-offset: 3px;
  transition: outline-color .12s ease, opacity .12s ease;
}
.card input { position: absolute; opacity: 0; pointer-events: none; }
.card:has(input:focus-visible) { box-shadow: 0 0 0 2.5px var(--steel); }
.card.on { outline-color: var(--marker); }
.card.off { opacity: .62; }
.card.off:hover { opacity: .9; }
.thumb {
  position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden;
  background: var(--table);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dur {
  position: absolute; right: 6px; bottom: 6px; background: rgba(12, 16, 22, .82); color: #fff;
  font-size: 12px; font-weight: 650; padding: 1px 6px; border-radius: 4px; font-variant-numeric: tabular-nums;
}
.badge {
  position: absolute; left: 6px; top: 6px; font-size: 12px; font-weight: 700;
  padding: 1px 7px; border-radius: 4px; background: rgba(12, 16, 22, .82); color: #fff;
}
.badge.live { background: var(--marker); }
.tick {
  position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; background: rgba(255, 255, 255, .9); border: 2px solid rgba(12, 16, 22, .35);
}
.tick svg { width: 16px; height: 16px; opacity: 0; color: #fff; }
.card.on .tick { background: var(--marker); border-color: var(--marker); }
.card.on .tick svg { opacity: 1; }
.card h3 {
  font-size: 14.5px; font-weight: 600; line-height: 1.3; margin: 9px 4px 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card .sub { font-size: 13px; color: var(--ink-3); margin: 0 4px; display: flex; gap: 10px; flex-wrap: wrap; }

/* download state on a card */
.jobbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(12,16,22,.35); }
.jobbar i { display: block; height: 100%; background: var(--steel); width: 0; transition: width .4s linear; }
.jobstate {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(12, 16, 22, .55); color: #fff; font-weight: 700; font-size: 14px;
}
.jobstate.done { background: rgba(20, 70, 44, .62); }
.jobstate.error { background: rgba(120, 18, 30, .7); }

/* empty state */
.empty { max-width: 640px; margin: 54px auto; text-align: left; }
.empty h2 { font-size: 26px; font-stretch: 112%; font-weight: 780; margin: 0 0 10px; letter-spacing: -.01em; }
.empty p { color: var(--ink-2); margin: 0 0 14px; }
.empty ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.empty li button {
  border: 1px dashed var(--rule); background: var(--sheet); border-radius: 8px; padding: 9px 12px;
  width: 100%; text-align: left; cursor: pointer; color: var(--ink-2);
}
.empty li button:hover { border-color: var(--ink-3); color: var(--ink); }
.empty li b { color: var(--ink); font-weight: 650; margin-right: 8px; }

.loading { display: flex; gap: 12px; align-items: center; color: var(--ink-2); margin: 40px 0; }
.spinner {
  width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--rule); border-top-color: var(--steel);
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- bottom action bar ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--sheet); border-top: 1px solid var(--rule);
  box-shadow: 0 -4px 18px rgba(27, 36, 48, .08);
}
.dock .inner {
  max-width: 1440px; margin: 0 auto; padding: 12px 24px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.dock .field { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--ink-3); }
.dock .field > span { font-weight: 600; }
.folder { display: flex; gap: 4px; align-items: center; }
.folder input {
  border: 1px solid var(--rule); border-radius: 8px; background: var(--table);
  padding: 7px 10px; font-size: 13.5px; width: min(360px, 40vw);
}
.dock .grow { flex: 1; }
.overall { font-size: 13px; color: var(--ink-2); min-width: 0; }
.overall .bar { width: 160px; height: 5px; background: var(--steel-soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.overall .bar i { display: block; height: 100%; background: var(--steel); width: 0; transition: width .4s linear; }

/* settings popover */
.pop {
  position: absolute; bottom: calc(100% + 10px); right: 0; width: 320px;
  background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .18); padding: 16px; display: grid; gap: 13px; font-size: 14px;
}
.pop[hidden] { display: none; }
.pop label.row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.pop label.row input { margin-top: 3px; accent-color: var(--marker); }
.pop small { display: block; color: var(--ink-3); font-size: 12.5px; }
.pop .line { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.relative { position: relative; }

/* ---------- downloads drawer ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 20;
  background: var(--sheet); border-left: 1px solid var(--rule); box-shadow: -10px 0 30px rgba(0, 0, 0, .14);
  display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s ease;
}
.drawer.open { transform: none; }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 16px 18px 10px; }
.drawer header h2 { margin: 0; font-size: 18px; font-weight: 750; flex: 1; }
.drawer .acts { display: flex; gap: 4px; padding: 0 14px 10px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); }
.jobs { overflow: auto; flex: 1; padding: 6px 0; }
.job { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 9px 18px; }
.job img { width: 72px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: var(--table); }
.job .t { font-size: 13.5px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.job .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.job .s .err { color: var(--marker); }
.job .s .ok { color: var(--ok); font-weight: 600; }
.job .bar { height: 4px; background: var(--steel-soft); border-radius: 2px; overflow: hidden; margin-top: 5px; }
.job .bar i { display: block; height: 100%; background: var(--steel); width: 0; transition: width .4s linear; }
.job .link { background: none; border: 0; padding: 0; color: var(--steel); cursor: pointer; font-size: 12.5px; text-decoration: underline; }
.jobs .none { padding: 30px 18px; color: var(--ink-3); }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .2); z-index: 15; }
.scrim[hidden] { display: none; }

.toast {
  position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 14px;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast[hidden] { display: none; }

.stopped { max-width: 520px; margin: 18vh auto; padding: 0 24px; }
.stopped h1 { font-stretch: 112%; font-size: 28px; }

@media (max-width: 720px) {
  header.top, .intake, .toolbar .inner, main, .dock .inner { padding-left: 16px; padding-right: 16px; }
  .intake form { grid-template-columns: 1fr; }
  .search { width: 100%; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 14px 12px; }
  .dock .inner { gap: 8px; padding-top: 8px; padding-bottom: 10px; }
  .dock .field > span { display: none; }
  .folder input { display: none; }
  .dock .grow { display: none; }
  .overall { order: -1; flex: 1 1 100%; }
  .overall .bar { width: 100%; }
  #downloadBtn { flex: 1 1 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2v8.5M4.5 7.5L8 11l3.5-3.5M3 14h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-gear" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

<div id="app">
<header class="top">
  <h1 class="wordmark"><span class="frame">group</span>DL</h1>
  <span class="spacer"></span>
  <button class="btn quiet dl-toggle" id="openDrawer" type="button">
    <svg><use href="#i-down"/></svg> Downloads <span class="count" id="jobCount" hidden>0</span>
  </button>
  <button class="btn quiet" id="quit" type="button">Quit</button>
</header>

<section class="intake">
  <form id="urlForm">
    <label class="sr" for="urls">YouTube links</label>
    <textarea class="urlbox" id="urls" rows="1" spellcheck="false"
      placeholder="Paste a YouTube channel, playlist or video link. One per line for several."></textarea>
    <div class="side">
      <button class="btn primary" type="submit" id="loadBtn">Show videos</button>
    </div>
    <div class="tabs" role="group" aria-label="Which parts of a channel to show">
      <span style="margin-right:4px">From channels, show</span>
      <label class="chip"><input type="checkbox" name="tab" value="videos" checked><span>Videos</span></label>
      <label class="chip"><input type="checkbox" name="tab" value="shorts"><span>Shorts</span></label>
      <label class="chip"><input type="checkbox" name="tab" value="streams"><span>Live</span></label>
    </div>
  </form>
</section>

<div class="banner" id="banner" hidden></div>

<div class="toolbar" id="toolbar" hidden>
  <div class="inner">
    <div class="tally" id="tally" aria-live="polite"></div>
    <label class="sr" for="filter">Filter by title</label>
    <input class="search" id="filter" type="search" placeholder="Filter by title">
    <label class="sr" for="sort">Sort</label>
    <select class="select" id="sort">
      <option value="page">Page order</option>
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="long">Longest first</option>
      <option value="short">Shortest first</option>
      <option value="views">Most viewed</option>
      <option value="title">Title A–Z</option>
    </select>
    <button class="btn" type="button" id="allOn">Tick all</button>
    <button class="btn" type="button" id="allOff">Untick all</button>
  </div>
</div>

<main id="sheet"></main>

<div class="dock">
  <div class="inner">
    <label class="field">
      <span>Download as</span>
      <select class="select" id="format"></select>
    </label>
    <div class="field folderfield">
      <span id="folderLabel">Save to</span>
      <div class="folder">
        <input id="folder" aria-labelledby="folderLabel" spellcheck="false">
        <button class="btn quiet" type="button" id="pickFolder">Change</button>
        <button class="btn quiet" type="button" id="openFolder">Open</button>
      </div>
    </div>
    <div class="relative">
      <button class="btn quiet" type="button" id="settingsBtn" aria-expanded="false" aria-controls="settings">
        <svg><use href="#i-gear"/></svg> Options
      </button>
      <div class="pop" id="settings" hidden>
        <label class="row"><input type="checkbox" id="optFolders">
          <span>Put each channel in its own folder</span></label>
        <label class="row"><input type="checkbox" id="optSkip">
          <span>Skip videos downloaded before<small>groupDL keeps a list in the save folder.</small></span></label>
        <label class="row"><input type="checkbox" id="optMeta">
          <span>Add title and channel to file details</span></label>
        <div class="line"><label for="optConc">Download at the same time</label>
          <select class="select" id="optConc">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select></div>
        <div class="line"><label for="optCookies">Sign in using browser</label>
          <select class="select" id="optCookies">
            <option value="none">Don't</option><option value="chrome">Chrome</option><option value="firefox">Firefox</option>
            <option value="edge">Edge</option><option value="safari">Safari</option><option value="brave">Brave</option>
            <option value="chromium">Chromium</option><option value="opera">Opera</option><option value="vivaldi">Vivaldi</option>
          </select></div>
        <small>Signing in uses that browser's YouTube login, which helps with age-restricted or members-only videos and with "confirm you're not a bot" errors.</small>
      </div>
    </div>
    <span class="grow"></span>
    <div class="overall" id="overall" hidden><span id="overallText"></span><div class="bar"><i id="overallBar"></i></div></div>
    <button class="btn primary" type="button" id="downloadBtn" disabled>
      <svg><use href="#i-down"/></svg> <span id="downloadLabel">Download</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Downloads" aria-hidden="true">
  <header>
    <h2>Downloads</h2>
    <button class="btn quiet" type="button" id="closeDrawer" aria-label="Close downloads"><svg><use href="#i-x"/></svg></button>
  </header>
  <div class="acts">
    <button class="btn quiet" type="button" id="cancelAll">Stop all</button>
    <button class="btn quiet" type="button" id="retryAll">Retry failed</button>
    <button class="btn quiet" type="button" id="clearDone">Clear finished</button>
    <button class="btn quiet" type="button" id="openFolder2">Open folder</button>
  </div>
  <div class="jobs" id="jobs"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
"use strict";
const TOKEN = "__GROUPDL_TOKEN__";
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "html") n.innerHTML = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : String(kid));
  return n;
};

async function api(path, body) {
  const opts = { headers: { "X-GroupDL-Token": TOKEN } };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  let data = {};
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}

// ---------------- state ----------------
const S = {
  sections: [],        // [{id,title,tag,url,error,videos:[...]}]
  selected: new Set(), // video ids
  jobs: [],
  jobsByVideo: new Map(),
  settings: {},
  loading: null,       // fetch task while loading
  lastClicked: null,
  stopped: false,
};

// ---------------- formatting ----------------
function fmtDur(s) {
  if (s == null) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}` : `${m}:${String(sec).padStart(2, "0")}`;
}
function fmtTotal(s) {
  if (!s) return "";
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? `${h} h ${m} min` : `${m} min`;
}
function fmtViews(n) {
  if (n == null) return "";
  const u = n >= 1e9 ? [1e9, "B"] : n >= 1e6 ? [1e6, "M"] : n >= 1e3 ? [1e3, "K"] : [1, ""];
  const v = n / u[0];
  return `${v >= 10 || !u[1] ? Math.round(v) : v.toFixed(1)}${u[1]} views`;
}
function vidTime(v) {
  if (v.timestamp) return v.timestamp * 1000;
  if (v.upload_date && /^\d{8}$/.test(v.upload_date)) {
    const d = v.upload_date;
    return Date.UTC(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8));
  }
  return null;
}
function fmtAgo(t) {
  if (!t) return "";
  const days = (Date.now() - t) / 864e5;
  if (days < 1) return "today";
  if (days < 2) return "yesterday";
  if (days < 14) return `${Math.floor(days)} days ago`;
  if (days < 60) return `${Math.floor(days / 7)} weeks ago`;
  if (days < 730) return `${Math.floor(days / 30)} months ago`;
  return `${Math.floor(days / 365)} years ago`;
}
function fmtBytes(b) {
  if (!b) return "";
  const u = ["B", "KB", "MB", "GB"]; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return `${b.toFixed(b >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
}
function fmtEta(s) {
  if (s == null) return "";
  return s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} min left`
    : s >= 60 ? `${Math.floor(s / 60)} min ${Math.round(s % 60)} s left` : `${Math.round(s)} s left`;
}
function toast(msg, ms = 2600) {
  const t = $("#toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}

// ---------------- videos & selection ----------------
function allVideos() {
  const seen = new Set(), out = [];
  for (const s of S.sections) for (const v of s.videos) if (!seen.has(v.id)) { seen.add(v.id); out.push(v); }
  return out;
}
function defaultTicked(v) {
  return !(v.live_status === "is_upcoming" || v.live_status === "is_live" ||
    ["subscriber_only", "premium_only", "needs_auth"].includes(v.availability));
}
function visible(videos) {
  const q = $("#filter").value.trim().toLowerCase();
  let list = q ? videos.filter((v) => v.title.toLowerCase().includes(q) || (v.channel || "").toLowerCase().includes(q)) : videos.slice();
  const sort = $("#sort").value;
  const by = {
    new: (a, b) => (vidTime(b) ?? -Infinity) - (vidTime(a) ?? -Infinity),
    old: (a, b) => (vidTime(a) ?? Infinity) - (vidTime(b) ?? Infinity),
    long: (a, b) => (b.duration ?? -1) - (a.duration ?? -1),
    short: (a, b) => (a.duration ?? Infinity) - (b.duration ?? Infinity),
    views: (a, b) => (b.views ?? -1) - (a.views ?? -1),
    title: (a, b) => a.title.localeCompare(b.title),
  }[sort];
  if (by) list.sort(by);
  return list;
}
function visibleAll() { return S.sections.flatMap((s) => visible(s.videos)); }

function setTicked(ids, on) {
  for (const id of ids) on ? S.selected.add(id) : S.selected.delete(id);
  for (const id of ids) {
    document.querySelectorAll(`.card[data-id="${CSS.escape(id)}"]`).forEach((c) => paintCard(c, on));
  }
  updateTally();
}
function paintCard(card, on) {
  card.classList.toggle("on", on);
  card.classList.toggle("off", !on);
  card.querySelector("input").checked = on;
}

// ---------------- rendering ----------------
function render() {
  const sheet = $("#sheet");
  sheet.replaceChildren();
  const has = S.sections.length > 0;
  $("#toolbar").hidden = !has;

  if (S.loading) {
    sheet.append(el("div", { class: "loading", role: "status" }, el("span", { class: "spinner" }),
      el("span", { id: "loadingMsg" }, S.loading.message || "Reading the page…")));
  }
  if (!has && !S.loading) { sheet.append(emptyState()); updateTally(); return; }

  for (const sec of S.sections) {
    const vids = visible(sec.videos);
    const wrap = el("section", { class: "section", "aria-label": sec.title });
    const total = sec.videos.reduce((a, v) => a + (v.duration || 0), 0);
    const head = el("div", { class: "section-head" },
      el("h2", {}, sec.title),
      sec.tag ? el("span", { class: "tag" }, sec.tag) : null,
      sec.error ? null : el("span", { class: "meta" },
        `${sec.videos.length} ${sec.videos.length === 1 ? "video" : "videos"}${total ? ", " + fmtTotal(total) : ""}`),
    );
    if (!sec.error && sec.videos.length > 1) {
      head.append(el("span", { class: "acts" },
        el("button", { class: "btn quiet", type: "button", onclick: () => setTicked(vids.map((v) => v.id), true) }, "Tick these"),
        el("button", { class: "btn quiet", type: "button", onclick: () => setTicked(vids.map((v) => v.id), false) }, "Untick these"),
      ));
    }
    wrap.append(head);
    if (sec.error) {
      wrap.append(el("div", { class: "section-error" },
        el("strong", {}, "Couldn't read this link."), el("p", {}, sec.error), hintFor(sec.error)));
    } else if (!vids.length) {
      wrap.append(el("p", { class: "meta", style: "color:var(--ink-3)" }, "No titles match the filter."));
    } else {
      const grid = el("div", { class: "grid" });
      for (const v of vids) grid.append(card(v));
      wrap.append(grid);
    }
    sheet.append(wrap);
  }
  updateTally();
  paintJobs();
}

function hintFor(err) {
  const e = err.toLowerCase();
  if (e.includes("bot") || e.includes("sign in") || e.includes("members") || e.includes("age"))
    return el("p", {}, "Try Options → Sign in using browser, pick the browser you use YouTube in, then show videos again.");
  if (e.includes("unsupported url") || e.includes("not a valid url"))
    return el("p", {}, "Check the link is a YouTube channel, playlist or video address.");
  return null;
}

function card(v) {
  const on = S.selected.has(v.id);
  const sub = el("div", { class: "sub" });
  const t = vidTime(v);
  if (v.views != null) sub.append(el("span", {}, fmtViews(v.views)));
  if (t) sub.append(el("span", {}, fmtAgo(t)));
  if (!sub.childNodes.length && v.channel) sub.append(el("span", {}, v.channel));
  let badge = null;
  if (v.live_status === "is_live") badge = el("span", { class: "badge live" }, "Live now");
  else if (v.live_status === "is_upcoming") badge = el("span", { class: "badge" }, "Upcoming");
  else if (["subscriber_only", "premium_only"].includes(v.availability)) badge = el("span", { class: "badge" }, "Members only");

  const c = el("label", { class: `card ${on ? "on" : "off"}`, "data-id": v.id },
    el("input", { type: "checkbox", checked: on, "aria-label": v.title }),
    el("div", { class: "thumb" },
      v.thumbnail ? el("img", { src: v.thumbnail, alt: "", loading: "lazy", referrerpolicy: "no-referrer" }) : null,
      v.duration ? el("span", { class: "dur" }, fmtDur(v.duration)) : null,
      badge,
      el("span", { class: "tick", html: '<svg><use href="#i-check"/></svg>' }),
    ),
    el("h3", { title: v.title }, v.title),
    sub,
  );
  const input = c.querySelector("input");
  c.addEventListener("click", (ev) => {
    if (ev.target === input) return;
    ev.preventDefault();
    const to = !S.selected.has(v.id);
    if (ev.shiftKey && S.lastClicked) {
      const order = visibleAll().map((x) => x.id);
      const a = order.indexOf(S.lastClicked), b = order.indexOf(v.id);
      if (a >= 0 && b >= 0) {
        setTicked(order.slice(Math.min(a, b), Math.max(a, b) + 1), to);
        S.lastClicked = v.id;
        return;
      }
    }
    setTicked([v.id], to);
    S.lastClicked = v.id;
  });
  input.addEventListener("change", () => { setTicked([v.id], input.checked); S.lastClicked = v.id; });
  return c;
}

function emptyState() {
  const examples = [
    ["A channel", "https://www.youtube.com/@NASA"],
    ["A playlist", "https://www.youtube.com/playlist?list=PL…"],
    ["A single video", "https://www.youtube.com/watch?v=…"],
  ];
  return el("div", { class: "empty" },
    el("h2", {}, "Paste a link to see its videos"),
    el("p", {}, "groupDL lists every video on the page you paste. Untick the ones you don't want, then download the rest in one go."),
    el("ul", {}, examples.map(([label, url]) => el("li", {},
      el("button", { type: "button", onclick: () => {
        const box = $("#urls");
        if (!url.endsWith("…")) { box.value = url; autosize(); $("#loadBtn").focus(); }
        else { box.value = url.replace("…", ""); autosize(); box.focus(); }
      } }, el("b", {}, label), url)))),
  );
}

function updateTally() {
  const vids = allVideos();
  const sel = vids.filter((v) => S.selected.has(v.id));
  const secs = sel.reduce((a, v) => a + (v.duration || 0), 0);
  const tally = $("#tally");
  tally.replaceChildren();
  if (vids.length) {
    tally.append(el("strong", {}, `${sel.length} of ${vids.length}`), " ticked",
      secs ? `, ${fmtTotal(secs)} in total` : "");
  }
  const btn = $("#downloadBtn");
  btn.disabled = sel.length === 0 || S.stopped;
  $("#downloadLabel").textContent = sel.length ? `Download ${sel.length} ${sel.length === 1 ? "video" : "videos"}` : "Download";
}

// ---------------- jobs ----------------
const STATUS_TEXT = { queued: "Waiting", downloading: "Downloading", processing: "Finishing up", done: "Downloaded",
  skipped: "Skipped", error: "Failed", cancelled: "Stopped" };

function paintJobs() {
  // badge + overall
  const active = S.jobs.filter((j) => ["queued", "downloading", "processing"].includes(j.status));
  const count = $("#jobCount");
  count.hidden = S.jobs.length === 0;
  count.textContent = active.length || S.jobs.length;

  const overall = $("#overall");
  if (active.length) {
    const batch = S.jobs.filter((j) => j.status !== "cancelled");
    const done = batch.filter((j) => ["done", "skipped", "error"].includes(j.status)).length;
    const prog = batch.reduce((a, j) => a + (["done", "skipped", "error"].includes(j.status) ? 1 : j.progress || 0), 0);
    overall.hidden = false;
    $("#overallText").textContent = `${done} of ${batch.length} finished`;
    $("#overallBar").style.width = `${(100 * prog / Math.max(batch.length, 1)).toFixed(1)}%`;
  } else overall.hidden = true;

  // cards
  S.jobsByVideo = new Map(S.jobs.map((j) => [j.video.id, j]));
  document.querySelectorAll(".card").forEach((c) => {
    const job = S.jobsByVideo.get(c.dataset.id);
    const thumb = c.querySelector(".thumb");
    thumb.querySelectorAll(".jobbar,.jobstate").forEach((n) => n.remove());
    if (!job) return;
    if (["downloading", "processing", "queued"].includes(job.status)) {
      const bar = el("div", { class: "jobbar" }, el("i", { style: `width:${(job.progress * 100).toFixed(1)}%` }));
      thumb.append(bar);
      if (job.status !== "downloading") thumb.append(el("div", { class: "jobstate" }, STATUS_TEXT[job.status]));
    } else if (job.status === "done" || job.status === "skipped") {
      thumb.append(el("div", { class: "jobstate done" }, job.status === "done" ? "Downloaded" : "Already downloaded"));
    } else if (job.status === "error") {
      thumb.append(el("div", { class: "jobstate error" }, "Failed"));
    }
  });

  // drawer list
  const list = $("#jobs");
  list.replaceChildren();
  if (!S.jobs.length) {
    list.append(el("div", { class: "none" }, "Nothing downloading yet. Tick some videos and click Download."));
    return;
  }
  for (const j of S.jobs.slice().reverse()) {
    const s = el("div", { class: "s" });
    if (j.status === "error") s.append(el("span", { class: "err" }, j.error || "Failed"));
    else if (j.status === "done") s.append(el("span", { class: "ok" }, j.note || "Downloaded"));
    else if (j.status === "skipped") s.append(el("span", {}, j.note || "Skipped"));
    else s.append(el("span", {}, STATUS_TEXT[j.status] || j.status));
    if (j.status === "downloading") {
      if (j.progress) s.append(el("span", {}, `${Math.floor(j.progress * 100)}%`));
      if (j.speed) s.append(el("span", {}, `${fmtBytes(j.speed)}/s`));
      if (j.eta != null) s.append(el("span", {}, fmtEta(j.eta)));
    }
    if (j.filename && j.status === "done")
      s.append(el("button", { class: "link", type: "button", onclick: () => api("/api/open-folder", { file: j.filename }).catch((e) => toast(e.message)) }, "Show in folder"));
    if (["error", "cancelled"].includes(j.status))
      s.append(el("button", { class: "link", type: "button", onclick: () => api("/api/retry", { ids: [j.id] }).then(poll) }, "Retry"));
    if (["queued", "downloading", "processing"].includes(j.status))
      s.append(el("button", { class: "link", type: "button", onclick: () => api("/api/cancel", { ids: [j.id] }).then(poll) }, "Stop"));
    const row = el("div", { class: "job" },
      el("img", { src: j.video.thumbnail || "", alt: "", loading: "lazy", referrerpolicy: "no-referrer" }),
      el("div", {}, el("div", { class: "t", title: j.video.title }, j.video.title), s,
        ["downloading", "processing"].includes(j.status) ? el("div", { class: "bar" }, el("i", { style: `width:${(j.progress * 100).toFixed(1)}%` })) : null),
    );
    list.append(row);
  }
}

let pollTimer = null;
async function poll() {
  clearTimeout(pollTimer);
  if (S.stopped) return;
  try {
    const st = await api("/api/state");
    const before = JSON.stringify(S.jobs.map((j) => [j.id, j.status]));
    S.jobs = st.jobs;
    paintJobs();
    const after = JSON.stringify(S.jobs.map((j) => [j.id, j.status]));
    if (before !== after) {
      const finished = S.jobs.length && !st.busy && before.includes("downloading");
      if (finished) {
        const ok = S.jobs.filter((j) => j.status === "done").length, bad = S.jobs.filter((j) => j.status === "error").length;
        toast(bad ? `Finished: ${ok} downloaded, ${bad} failed` : `Finished: ${ok} downloaded`, 4000);
      }
    }
    pollTimer = setTimeout(poll, st.busy ? 900 : 5000);
  } catch (e) {
    pollTimer = setTimeout(poll, 3000);
  }
}

// ---------------- loading URLs ----------------
async function loadUrls(ev) {
  ev && ev.preventDefault();
  const urls = $("#urls").value.split(/\s*\n\s*|\s+(?=https?:\/\/)/).map((s) => s.trim()).filter(Boolean);
  if (!urls.length) { $("#urls").focus(); toast("Paste a YouTube link first"); return; }
  const tabs = [...document.querySelectorAll('input[name="tab"]:checked')].map((i) => i.value);
  $("#loadBtn").disabled = true;
  try {
    let task = await api("/api/fetch", { urls, tabs });
    S.sections = []; S.selected.clear(); S.loading = task; render();
    while (task.status === "running") {
      await new Promise((r) => setTimeout(r, 600));
      task = await api(`/api/fetch/${task.id}`);
      const m = $("#loadingMsg");
      if (m) m.textContent = task.message;
    }
    S.loading = null;
    S.sections = task.sections;
    for (const v of allVideos()) if (defaultTicked(v)) S.selected.add(v.id);
    $("#filter").value = "";
    render();
    const n = allVideos().length;
    if (n) toast(`Found ${n} ${n === 1 ? "video" : "videos"}`);
  } catch (e) {
    S.loading = null; render(); toast(e.message, 4000);
  } finally {
    $("#loadBtn").disabled = false;
  }
}

// ---------------- settings ----------------
function readSettings() {
  return {
    format: $("#format").value,
    output_dir: $("#folder").value.trim(),
    channel_folders: $("#optFolders").checked,
    skip_downloaded: $("#optSkip").checked,
    embed_metadata: $("#optMeta").checked,
    concurrency: +$("#optConc").value,
    cookies_browser: $("#optCookies").value,
  };
}
function applySettings(s) {
  S.settings = s;
  $("#format").value = s.format;
  $("#folder").value = s.output_dir;
  $("#optFolders").checked = s.channel_folders;
  $("#optSkip").checked = s.skip_downloaded;
  $("#optMeta").checked = s.embed_metadata;
  $("#optConc").value = String(s.concurrency);
  $("#optCookies").value = s.cookies_browser || "none";
  document.querySelectorAll('input[name="tab"]').forEach((i) => (i.checked = (s.tabs || ["videos"]).includes(i.value)));
}
let saveT = null;
function saveSettings() {
  clearTimeout(saveT);
  saveT = setTimeout(() => api("/api/settings", readSettings()).then((r) => (S.settings = r.settings)).catch(() => {}), 300);
}

async function startDownload() {
  const vids = allVideos().filter((v) => S.selected.has(v.id));
  if (!vids.length) return;
  $("#downloadBtn").disabled = true;
  try {
    const r = await api("/api/download", { videos: vids, settings: readSettings() });
    toast(r.added ? `Downloading ${r.added} ${r.added === 1 ? "video" : "videos"}` : "Those videos are already in the queue");
    poll();
  } catch (e) { toast(e.message, 4000); }
  finally { updateTally(); }
}

// ---------------- drawer ----------------
function setDrawer(open) {
  $("#drawer").classList.toggle("open", open);
  $("#drawer").setAttribute("aria-hidden", String(!open));
  $("#scrim").hidden = !open;
  if (open) $("#closeDrawer").focus();
}

function autosize() {
  const b = $("#urls");
  b.style.height = "auto";
  b.style.height = Math.min(b.scrollHeight + 3, 240) + "px";
}

// ---------------- wire up ----------------
async function init() {
  const st = await api("/api/state");
  const fmt = $("#format");
  for (const [k, label] of Object.entries(st.formats)) fmt.append(el("option", { value: k }, label));
  applySettings(st.settings);
  S.jobs = st.jobs;
  const warn = [];
  if (!st.ffmpeg) warn.push("ffmpeg wasn't found, so high-quality video and MP3 downloads won't work. Install ffmpeg or use a groupDL release build, which includes it.");
  if (!st.deno) warn.push("Deno wasn't found. YouTube downloads may fail or be limited to low quality. Install Deno or use a groupDL release build, which includes it.");
  if (warn.length) { $("#banner").textContent = warn.join(" "); $("#banner").hidden = false; }
  render();
  poll();
}

$("#urlForm").addEventListener("submit", loadUrls);
$("#urls").addEventListener("input", autosize);
$("#urls").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) loadUrls(e); });
$("#urls").addEventListener("paste", () => setTimeout(autosize));
$("#filter").addEventListener("input", render);
$("#sort").addEventListener("change", render);
$("#allOn").addEventListener("click", () => setTicked(visibleAll().map((v) => v.id), true));
$("#allOff").addEventListener("click", () => setTicked(visibleAll().map((v) => v.id), false));
$("#downloadBtn").addEventListener("click", startDownload);
["#format", "#folder", "#optFolders", "#optSkip", "#optMeta", "#optConc", "#optCookies"].forEach((s) => $(s).addEventListener("change", saveSettings));
$("#pickFolder").addEventListener("click", async () => {
  try {
    const r = await api("/api/pick-folder", {});
    if (r.path) $("#folder").value = r.path;
  } catch (e) { toast(e.message, 4000); $("#folder").focus(); $("#folder").select(); }
});
const openFolder = () => api("/api/open-folder", { path: $("#folder").value.trim() }).catch((e) => toast(e.message));
$("#openFolder").addEventListener("click", openFolder);
$("#openFolder2").addEventListener("click", openFolder);
$("#settingsBtn").addEventListener("click", (e) => {
  const pop = $("#settings"); pop.hidden = !pop.hidden;
  e.currentTarget.setAttribute("aria-expanded", String(!pop.hidden));
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".relative")) { $("#settings").hidden = true; $("#settingsBtn").setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { setDrawer(false); $("#settings").hidden = true; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && document.activeElement.type !== "checkbox";
  if (!typing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && S.sections.length) {
    e.preventDefault(); setTicked(visibleAll().map((v) => v.id), true);
  }
});
$("#openDrawer").addEventListener("click", () => setDrawer(true));
$("#closeDrawer").addEventListener("click", () => setDrawer(false));
$("#scrim").addEventListener("click", () => setDrawer(false));
$("#cancelAll").addEventListener("click", () => api("/api/cancel", {}).then(poll));
$("#retryAll").addEventListener("click", () => api("/api/retry", {}).then(poll));
$("#clearDone").addEventListener("click", () => api("/api/clear", {}).then(poll));
$("#quit").addEventListener("click", async () => {
  const busy = S.jobs.some((j) => ["queued", "downloading", "processing"].includes(j.status));
  if (busy && !confirm("Downloads are still running. Quit and stop them?")) return;
  try { await api("/api/quit", {}); } catch (_) {}
  S.stopped = true;
  document.body.replaceChildren(el("div", { class: "stopped" },
    el("h1", {}, "groupDL has stopped"),
    el("p", {}, "You can close this tab. Open groupDL again whenever you need it.")));
});
