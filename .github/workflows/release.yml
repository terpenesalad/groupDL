name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: groupDL-windows.exe
            built: dist/groupDL.exe
          - os: macos-latest
            artifact: groupDL-macos-arm64
            built: dist/groupDL
          - os: ubuntu-22.04
            artifact: groupDL-linux
            built: dist/groupDL
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg
        run: python scripts/fetch_ffmpeg.py build/ffmpeg
      - name: Build
        shell: bash
        run: python scripts/build.py --ffmpeg "build/ffmpeg/ffmpeg$([ "$RUNNER_OS" = Windows ] && echo .exe)"
      - name: Check the built app joins video and sound
        shell: bash
        run: |
          "${{ matrix.built }}" --version
          "${{ matrix.built }}" --self-test
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    # Runs for a pushed v* tag, or when started by hand from the Actions tab
    # (the tag is then made from the version in groupdl/__init__.py).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("groupdl/__init__.py").read()).group(1))')"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "groupDL $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
